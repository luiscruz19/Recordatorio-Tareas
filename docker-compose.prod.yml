# deploy.sh lo usa para construir y publicar la imagen; en el servidor, para pull y up.
# La SECRET_KEY del .env tiene que coincidir con la de fichada, que corre en la misma red.
services:
  recordatorios_api:
    build:
      context: ./api
      dockerfile: Dockerfile.production
    image: ghcr.io/luiscruz19/recordatorios-api:${TAG:-TEST}
    container_name: recordatorios_api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=net-shared"
      - "traefik.http.routers.recordatorios_api.rule=Host(`recordatorios.sda.ovh`)"
      - "traefik.http.routers.recordatorios_api.priority=20"
      - "traefik.http.services.recordatorios_api.loadbalancer.server.port=80"
    networks:
      - net-shared

networks:
  net-shared:
    external: true
