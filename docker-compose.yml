# Requiere la red net-shared con Traefik y MySQL, y fichada_api levantado para el login.
name: recordatorios

services:
  recordatorios_api:
    build:
      context: ./api
      dockerfile: Dockerfile.development
    container_name: recordatorios_api
    restart: always
    env_file: ./api/.env
    environment:
      - NODE_ENV=development
      - TZ=America/Argentina/Buenos_Aires
    ports:
      # Acceso sin Traefik para los builds de la app contra la red local.
      - "4010:80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=net-shared"
      - "traefik.http.routers.recordatorios_api.rule=Host(`recordatorios-api.localhost`)"
      - "traefik.http.routers.recordatorios_api.priority=10"
      - "traefik.http.services.recordatorios_api.loadbalancer.server.port=80"
    networks:
      - net-shared

networks:
  net-shared:
    external: true
